name: Deploy to Hetzner Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          # Setup SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Add server to known_hosts
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

          # Deploy naar server
          ssh -i ~/.ssh/deploy_key $SERVER_USER@$SERVER_HOST 'cd ~/apps/ai-news-bot && \
            echo "🧹 Cleaning workspace..." && \
            git reset --hard HEAD && git clean -fd && \
            echo "📥 Pulling latest code..." && \
            git pull origin main && \
            echo "🔍 Checking Python version compatibility..." && \
            PYTHON_VERSION=$(python3 --version | cut -d" " -f2 | cut -d"." -f1,2) && \
            VENV_VERSION=$(grep "^version" venv/pyvenv.cfg 2>/dev/null | cut -d"=" -f2 | tr -d " " | cut -d"." -f1,2 || echo "none") && \
            if [ "$PYTHON_VERSION" != "$VENV_VERSION" ]; then \
              echo "⚠️ Python mismatch: system=$PYTHON_VERSION, venv=$VENV_VERSION" && \
              echo "🔄 Rebuilding venv..." && \
              rm -rf venv && \
              python3 -m venv venv && \
              source venv/bin/activate && \
              pip install -r requirements.txt; \
            else \
              echo "✓ Python versions match ($PYTHON_VERSION)" && \
              source venv/bin/activate && \
              pip install -r requirements.txt --quiet; \
            fi && \
            echo "🔄 Restarting systemd timer..." && \
            sudo systemctl restart ai-news-bot.timer && \
            echo "✅ Deployment complete!" && \
            echo "Next run:" && \
            systemctl list-timers ai-news-bot.timer --no-pager | grep ai-news-bot'

          echo "🚀 Server deployment successful!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
