# RSS Feed Sources for AI News
# This file contains all news sources organized by language

# International sources (English)
international:
  # Major Tech Media
  TechCrunch AI: "https://techcrunch.com/tag/artificial-intelligence/feed/"
  VentureBeat AI: "https://venturebeat.com/category/ai/feed/"
  MIT Technology Review: "https://www.technologyreview.com/feed/"
  Ars Technica AI: "https://arstechnica.com/tag/ai/feed/"
  Wired AI: "https://www.wired.com/feed/tag/ai/latest/rss"
  The Next Web: "https://thenextweb.com/feed"
  The Verge AI: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
  Engadget AI: "https://www.engadget.com/tag/ai/rss.xml"

  # Official AI Company Blogs
  OpenAI Blog: "https://openai.com/blog/rss/"
  Google AI Blog: "https://blog.google/technology/ai/rss/"
  DeepMind Blog: "https://deepmind.google/blog/rss.xml"
  Meta AI Blog: "https://ai.meta.com/blog/rss/"
  Microsoft AI Blog: "https://blogs.microsoft.com/ai/feed/"

  # Research & Academic
  arXiv AI: "https://rss.arxiv.org/rss/cs.AI"
  arXiv Machine Learning: "https://rss.arxiv.org/rss/cs.LG"
  arXiv Computer Vision: "https://rss.arxiv.org/rss/cs.CV"
  arXiv NLP: "https://rss.arxiv.org/rss/cs.CL"

  # Industry Verticals
  Healthcare IT News AI: "https://www.healthcareitnews.com/taxonomy/term/31/feed"
  Robotics Business Review: "https://www.roboticsbusinessreview.com/feed/"
  Autonomous Vehicle News: "https://www.autonomousvehicleinternational.com/feed"

# Open Source, LLM Development & Technical Analysis
  # Crucial for Open Source models & demos
  Hugging Face Blog: "https://huggingface.co/blog/feed.xml"
  # The creator of Claude - Major LLM player missing from your list
  Anthropic Engineering News: "https://raw.githubusercontent.com/conoro/anthropic-engineering-rss-feed/main/anthropic_engineering_rss.xml"
  # Focus on Open Source Image Gen (Stable Diffusion)
  Stability AI: "https://stability.ai/news?format=rss"
  # Technical deep dives into LLMs and engineering (Simon Willison is a must-read)
  Simon Willison’s Weblog: "https://simonwillison.net/atom/tags/ai/"
  # Deep technical analysis of LLM alignment and open source (Nathan Lambert)
  Interconnects: "https://www.interconnects.ai/feed"
  # Focus on building with LLMs (Frameworks)
  LangChain Blog: "https://blog.langchain.dev/rss/"
  # Hardware & Infrastructure driving LLMs
  NVIDIA Blog (AI Category): "https://blogs.nvidia.com/category/deep-learning/feed/"
  # Safety, Ethics & Policy around AI
  Gen AI Security: "https://genai.owasp.org/feed/"
# AI for Creativity, Work & Culture
  # Prof. Ethan Mollick - The best source on how AI changes actual work/education
  One Useful Thing: "https://www.oneusefulthing.org/feed"
  # Focus on Game Dev & 3D Art creation with AI
  80 Level (AI Section): "https://80.lv/rss/tag/ai"
  # Digital Art & Design news (often covers Firefly/Midjourney tools)
  Creative Bloq: "https://www.creativebloq.com/feeds/all"
  # Photography & AI Image generation news
  PetaPixel: "https://petapixel.com/feed/"
  # Highly regarded European tech news, very good AI analysis
  The Decoder: "https://the-decoder.com/feed/"
  # Academic updates made readable (often covers creative papers)
  MarkTechPost: "https://www.marktechpost.com/feed/"

# Blogs about AI Ethics, Policy, and Society
  AI Ethics Lab: "https://aiethicslab.com/feed/"
  AI Policy Exchange: "https://aipolicyexchange.org/feed/"
  Data & Society: "https://datasociety.net/feed/"

# Blogs on AI in Business and Industry
  AI in Business: "https://aibusiness.com/feed/"
  The AI Report: "https://theaireport.com/feed/"
  AI Trends: "https://www.aitrends.com/feed/"
  Simon Willison’s Weblog - AI in Industry: "https://simonwillison.net/atom/everything/"
  The Neuron: "https://www.theneuron.ai/newsletter/rss.xml"

